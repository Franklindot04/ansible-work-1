---
- name: install HTTP server
  hosts: n2
  become: yes

  tasks:
  - name: install Apache2
    apt:
      name: apache2
      state: latest
      update_cache: yes

  - name: start apache2
    service:
      name: apache2
      state: started

  - name: Enable Apache2
    service:
      name: apache2
      enabled: yes
...         
